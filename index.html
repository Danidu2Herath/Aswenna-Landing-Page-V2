    <!-- ===================================================================

          {
            "@type": "FAQPage",
            "@id": "https://aswenna.lk/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do I need to buy sensors or hardware?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Tier 0 is the whole software platform with no hardware at all — soil profiling, crop recommendations, the cultivation calendar, alerts, market analytics and satellite crop-health maps. Hardware only adds measured readings from your own plot on top of that."
                }
              },
              {
                "@type": "Question",
                "name": "What if I do not have a smartphone or a signal?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Alerts and recommendations can be delivered by SMS or by voice call to a basic handset, and the application itself is offline-first: it keeps working without a connection and synchronises when one returns."
                }
              },
              {
                "@type": "Question",
                "name": "How accurate are the soil values?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It depends on where they come from, and Aswenna always tells you which. Estimated values are derived from regional soil databases for your mapped location. Measured values come from a field device or a handheld probe on your plot. The two are never mixed or presented as the same thing."
                }
              },
              {
                "@type": "Question",
                "name": "Who owns the data from my land?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You do. Plot boundaries, readings and history belong to the farmer, and can be exported at any time. Data shared with a farmer organization or an extension officer is anonymized where it feeds area-wide analysis."
                }
              },
              {
                "@type": "Question",
                "name": "Is Aswenna available in Sinhala and Tamil?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The interface and the alerts are planned in Sinhala, Tamil and English, because advice that cannot be read is not advice."
                }
              },
              {
                "@type": "Question",
                "name": "Is this available to use today?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not yet. Aswenna is an academic and agricultural research initiative. Phases 01 to 03 describe the planned project scope and Phase 04 collects proposed future extensions — none of it describes a deployed commercial service."
                }
              }
