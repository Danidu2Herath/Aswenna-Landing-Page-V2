name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Runs check:env, SEO generation, tsc, vite build and prerender.
      # Values come from repo secrets (Settings > Secrets and variables > Actions).
      # Note: VITE_* values are inlined into the public bundle regardless.
      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_CONTACT_ENDPOINT: ${{ secrets.VITE_CONTACT_ENDPOINT }}
          VITE_CONTACT_TIMEOUT_MS: ${{ secrets.VITE_CONTACT_TIMEOUT_MS }}
          VITE_CF_BEACON_ID: ${{ secrets.VITE_CF_BEACON_ID }}

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are not available to pull requests from forks, so skip those.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Production = push to main. Everything else gets a preview URL.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
